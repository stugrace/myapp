<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/myapp/favicon.svg" />
    <link rel="manifest" href="/myapp/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Progressive web app for weather forecasts and location management" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <title>Weather Forecast App</title>
    <script type="module" crossorigin src="/myapp/assets/index-Ci1caCzi.js"></script>
    <link rel="stylesheet" crossorigin href="/myapp/assets/index-_Hyp5Rgv.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js', { scope: '/' })
            .then((registration) => {
              console.log('✓ Service Worker registered:', registration)
            })
            .catch((error) => {
              console.error('✗ Service Worker registration failed:', error)
            })
        })
      } else {
        console.warn('Service Workers are not supported in this browser')
      }

      // Listen for install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('✓ Install prompt available')
        e.preventDefault()
        window.deferredPrompt = e
      })

      window.addEventListener('appinstalled', () => {
        console.log('✓ App installed')
      })
    </script>
  </body>
</html>
